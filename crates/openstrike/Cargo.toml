[package]
name = "openstrike"
description = "OpenStrike: a CS-like FPS with bots and desktop LAN multiplayer on the Pocket runtime family"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openstrike-core = { path = "../openstrike-core" }
pocket3d = { workspace = true, features = ["bsp"] }
pocket-mod = { workspace = true }
pocket-ui-wgpu = { workspace = true }
pocketjs-core = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rodio = { version = "0.20", default-features = false, features = ["wav"] }
